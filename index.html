<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free App Swap - Login JSON ready</title>
  <link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/account.css" />
<link rel="stylesheet" href="css/search.css" />
<link rel="stylesheet" href="css/download.css" />
<link rel="stylesheet" href="css/upload.css" />
<link rel="stylesheet" href="css/product.css" />
<link rel="stylesheet" href="css/responsive.css" />
<link rel="stylesheet" href="css/intro.css">
</head>


<body>
  <main class="space">

    <div id="introBirth" class="intro-birth">
      <div class="intro-stars" id="introStars"></div>
      <div class="intro-earth"></div>

      <div class="intro-title">
        FREE APP EXCHANGE
      </div>

      <div class="intro-text intro-text-top">
        <div>Gratis apps door hobby ontwerpers</div>
        <div>voor hobbyontwerpers</div>
        <div class="intro-small">100 % gratis - geen advertenties - geen abonnementen !</div>
      </div>

      <div class="intro-text intro-text-bottom">
        <div>Gratis download - gratis upload</div>
        <div>Niets verborgen alles open en met respect voor privacy.</div>
        <div>Maak een account en U krijgt toegang!</div>
      </div>
    </div>
   

    <div class="bubble search" id="search">
      <svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-label="Zoek bol">
        <defs>
          <radialGradient id="searchBall" cx="30%" cy="18%" r="85%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="20%" stop-color="#fff4a5"/>
            <stop offset="50%" stop-color="#ffc24f"/>
            <stop offset="76%" stop-color="#ff8b25"/>
            <stop offset="100%" stop-color="#d85b22"/>
          </radialGradient>
          <radialGradient id="searchShade" cx="82%" cy="88%" r="70%">
            <stop offset="0%" stop-color="rgba(0,0,0,.34)"/>
            <stop offset="45%" stop-color="rgba(0,0,0,.10)"/>
            <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
          </radialGradient>
        </defs>
        <circle cx="500" cy="500" r="500" fill="url(#searchBall)"/>
        <circle cx="500" cy="500" r="500" fill="url(#searchShade)"/>
        <ellipse cx="285" cy="150" rx="175" ry="55" fill="white" opacity=".72" transform="rotate(-34 285 150)"/>
        <circle cx="290" cy="175" r="120" fill="white" opacity=".24"/>
        <g class="search-symbol" fill="none" stroke="#111733" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="405" cy="300" r="68"/>
          <path d="M455 350 L555 450"/>
        </g>
        <text class="search-label" x="500" y="535" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="150" font-weight="950" fill="#111733">ZOEK</text>
      </svg>
      <div class="search-panel" aria-hidden="false">
        <div class="search-menu" aria-label="Sitemap">
          <button class="search-link sitemap-main" type="button" data-target="account">ACCOUNT</button>

          <button class="search-link sitemap-main" type="button" data-target="download">DOWNLOAD</button>
          <button class="search-link sitemap-child" type="button" data-target="apk">↳ APK</button>
          <button class="search-link sitemap-child" type="button" data-target="pwa">↳ PWA</button>

          <button class="search-link sitemap-main" type="button" data-target="upload">UPLOAD</button>
        </div>
      </div>
    </div>

    <div class="bubble account" id="account">
      <div class="account-shell">
        <div class="account-form" id="accountPanel">
          <div class="account-title" id="accountTitle">ACCOUNT</div>

          <div class="account-phase account-phase-start" id="accountStart">
            <button class="account-choice" id="showLogin" type="button">LOGIN</button>
            <button class="account-choice" id="showRegister" type="button">REGISTREER</button>
          </div>

          <form class="account-phase account-phase-form" id="accountForm">
            <input class="register-only" id="loginName" name="name" type="text" placeholder="Naam" autocomplete="name" />
            <input id="loginEmail" name="email" type="text" placeholder="Email of naam" autocomplete="username" />
            <input id="loginPassword" name="password" type="password" placeholder="Paswoord" autocomplete="current-password" />
            <input class="register-only" id="loginPasswordConfirm" name="passwordConfirm" type="password" placeholder="Paswoord bevestigen" autocomplete="new-password" />
            <button id="accountSubmit" type="submit">LOGIN</button>
            <button class="forgot-link" id="forgotPassword" type="button">paswoord vergeten?</button>
           
            <div class="login-message" id="loginMessage"></div>
            <button class="back-link" id="backToAccountStart" type="button">terug</button>
            <button class="json-export" id="exportUsersJson" type="button" title="Prototype: download lokale gebruikers als JSON">JSON</button>
          </form>
        </div>
      </div>
    </div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
