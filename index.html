<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free App Swap</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="space" id="space" aria-label="Free App Swap universe">
    <div class="bubble home" id="homeBubble" data-bubble="home">
      <div class="home-globe">
        <svg viewBox="0 0 1000 1000" class="globe-svg" aria-hidden="true">
          <defs>
            <clipPath id="globeClip"><circle cx="500" cy="500" r="498"/></clipPath>
            <radialGradient id="ocean" cx="30%" cy="22%" r="78%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="18%" stop-color="#dffaff"/>
              <stop offset="42%" stop-color="#76d9ff"/>
              <stop offset="72%" stop-color="#289bd6"/>
              <stop offset="100%" stop-color="#185e9f"/>
            </radialGradient>
            <radialGradient id="shade" cx="78%" cy="84%" r="65%">
              <stop offset="0%" stop-color="rgba(0,0,0,.36)"/>
              <stop offset="42%" stop-color="rgba(0,0,0,.15)"/>
              <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
            </radialGradient>
            <path id="arcTop" d="M 190 292 C 330 170, 670 170, 810 292"/>
          </defs>
          <g clip-path="url(#globeClip)">
            <circle cx="500" cy="500" r="500" fill="url(#ocean)"/>
            <path d="M170,380 C230,310 300,300 345,350 C390,400 360,455 415,505 C465,550 545,520 575,580 C610,655 520,735 410,700 C315,670 300,590 230,575 C155,558 105,470 170,380Z" fill="#62d389" opacity=".82"/>
            <path d="M620,275 C710,245 815,310 820,405 C825,485 750,520 710,585 C665,655 710,740 630,785 C555,828 485,760 520,690 C550,630 610,610 585,545 C560,480 490,440 525,365 C545,325 575,290 620,275Z" fill="#50c878" opacity=".76"/>
            <path d="M115,650 C160,605 230,615 270,660 C312,710 265,775 190,770 C125,766 78,704 115,650Z" fill="#72dc96" opacity=".62"/>
            <path d="M780,630 C840,590 910,635 902,710 C895,780 815,800 775,750 C745,710 735,665 780,630Z" fill="#72dc96" opacity=".55"/>
            <path d="M150,250 C250,205 350,218 445,255 C535,290 650,285 790,235" stroke="white" stroke-width="32" stroke-linecap="round" fill="none" opacity=".35"/>
            <path d="M105,520 C255,470 365,500 480,535 C620,578 770,552 900,492" stroke="white" stroke-width="28" stroke-linecap="round" fill="none" opacity=".22"/>
            <circle cx="500" cy="500" r="500" fill="url(#shade)"/>
            <circle cx="290" cy="210" r="180" fill="white" opacity=".30"/>
            <circle cx="230" cy="160" r="80" fill="white" opacity=".40"/>
          </g>
          <text font-family="system-ui, Segoe UI, sans-serif" font-weight="950" font-size="58" letter-spacing="5" fill="#1e1e2f" opacity=".94">
            <textPath href="#arcTop" startOffset="50%" text-anchor="middle">FREE APP SWAP</textPath>
          </text>
          <text x="500" y="395" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-weight="850" font-size="35" fill="#1e1e2f">An exchange market for apps</text>
          <text x="500" y="438" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-weight="850" font-size="35" fill="#1e1e2f">made by hobby developers</text>
          <text x="500" y="520" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-weight="900" font-size="34" fill="#1e1e2f" opacity=".90">Free apps • No ads • No subscriptions</text>
          <text x="500" y="590" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-weight="700" font-size="27" fill="#1e1e2f" opacity=".80">Downloading is free</text>
          <text x="500" y="628" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-weight="700" font-size="27" fill="#1e1e2f" opacity=".80">Uploading requires a free member account</text>
        </svg>
      </div>
    </div>

    <div class="bubble search" id="searchBubble" data-bubble="search"></div>
    <div class="bubble account active" id="accountBubble" data-bubble="account"></div>
    <div class="bubble download hidden" id="downloadBubble" data-bubble="download"></div>
    <div class="bubble upload hidden" id="uploadBubble" data-bubble="upload"></div>
  </main>

  <script src="js/dataStore.js"></script>
  <script src="js/bubbles.js"></script>
  <script src="js/account.js"></script>
  <script src="js/search.js"></script>
  <script src="js/download.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/universe.js"></script>
</body>
</html>
